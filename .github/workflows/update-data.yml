name: Atualização pós-rodada

on:
  schedule:
    # A cada 2 horas: a ESPN publica os placares minutos após o fim de cada
    # jogo, então a janela curta pega os resultados no mesmo dia. Sem dados
    # novos a execução é um no-op rápido (~1 min).
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Collect, validate and package post-round data
        id: update
        env:
          FETCH: '1'
          API_FUTEBOL_BR_KEY: ${{ secrets.API_FUTEBOL_BR_KEY }}
          # Orçamento por ciclo da API Futebol BR: plano Premium (trial até
          # 14/11/2026) = 1.000/dia; após o trial (100/dia), reduzir para 6.
          API_FUTEBOL_BR_PER_RUN: '25'
        run: |
          # O updater faz o commit internamente quando há dados novos, então
          # `git status` depois dele fica limpo e não serve como sinal: o que
          # detecta mudança é a comparação do HEAD antes/depois. A árvore suja
          # é tratada como fallback (alteração que o updater não commitou),
          # para nunca publicar um dist sem o dado versionado.
          data_paths='src/currentSeasonResults.ts src/projectionData.ts src/sourceMetadata.ts src/advancedStats2026.ts src/scorers2026.ts data/source-snapshots docs/atualizacoes.md'
          before=$(git rev-parse HEAD)
          node scripts/update-data.mjs
          after=$(git rev-parse HEAD)
          if [ "$before" != "$after" ]; then
            echo "Novo commit de dados: $before -> $after"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$(git status --porcelain -- $data_paths)" ]; then
            echo "::warning::updater deixou alterações sem commit; commitando na workflow para publicar estado versionado."
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- $data_paths
            git commit -m "data: atualização pós-rodada (árvore não commitada pelo updater)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sem dados novos (HEAD ${after:0:7}, árvore limpa nos caminhos de dados)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push data commit
        if: steps.update.outputs.changed == 'true'
        run: git push origin HEAD:main
      - name: Build for the project site
        if: steps.update.outputs.changed == 'true'
        run: |
          npm run build
          npm run smoke:pages
        env:
          GITHUB_PAGES: 'true'
      - name: Upload Pages artifact
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: needs.update.outputs.changed == 'true'
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
