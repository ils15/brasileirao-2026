# Publicação do Pages num único lugar: build com `GITHUB_PAGES=true`, smoke de
# assets e deploy. Chamado por `pages.yml` (push em `main`) e por
# `update-data.yml` (quando o bot commita dados). O segundo caller é necessário
# porque push feito com `GITHUB_TOKEN` não dispara outros workflows: o updater
# precisa publicar por conta própria, e duplicar build/upload/deploy nos dois
# arquivos deixaria as cópias divergirem. `workflow_dispatch` existe só para
# provar o caminho sem depender de um caller.
name: Pages build & deploy

on:
  workflow_call:
    inputs:
      sha:
        description: >-
          Commit a publicar. O updater passa o HEAD que acabou de empurrar:
          o checkout de um workflow chamado usa, por padrão, o SHA do evento
          do caller — que no cron é anterior ao commit do bot.
        required: false
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serializa a publicação de qualquer caller: dois deploys concorrentes disputam
# o mesmo ambiente `github-pages`, e o artefato mais novo deve vencer por ordem
# de chegada, não por corrida.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build for the project site
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Verify project-site asset paths
        run: npm run smoke:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
