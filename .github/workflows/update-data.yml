name: Atualização pós-rodada

on:
  schedule:
    # A cada 2 horas: a ESPN publica os placares minutos após o fim de cada
    # jogo, então a janela curta pega os resultados no mesmo dia. Sem dados
    # novos a execução é um no-op rápido (~1 min).
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Collect, validate and package post-round data
        id: update
        env:
          FETCH: '1'
        run: |
          set -euo pipefail
          # O updater faz o commit internamente quando há dados novos, então
          # `git status` depois dele fica limpo e não serve como sinal: o que
          # detecta mudança é a comparação do HEAD antes/depois. Falha do
          # updater aborta o run: módulos podem ter sido escritos, mas nada é
          # commitado nem publicado sem o gate completo do step seguinte.
          data_paths='src/currentSeasonResults.ts src/projectionData.ts src/sourceMetadata.ts src/advancedStats2026.ts src/scorers2026.ts data/source-snapshots docs/atualizacoes.md'
          before=$(git rev-parse HEAD)
          if ! node scripts/update-data.mjs; then
            dirty=$(git status --porcelain -- $data_paths)
            echo "::error::updater falhou; alterações pendentes nos caminhos de dados:%0A${dirty}"
            exit 1
          fi
          after=$(git rev-parse HEAD)
          if [ "$before" != "$after" ]; then
            echo "Novo commit de dados: $before -> $after"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Sem dados novos (HEAD ${after:0:7}, árvore limpa nos caminhos de dados)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Full test suite gate
        if: steps.update.outputs.changed == 'true'
        run: npm test
      - name: Push data commit
        if: steps.update.outputs.changed == 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::rebase sobre origin/main conflitou em arquivos gerados; intervenção humana necessária."
              exit 1
            fi
            sleep $((attempt * 10))
          done
          echo "::error::push falhou após 3 tentativas."
          exit 1
      - name: Build for the project site
        if: steps.update.outputs.changed == 'true'
        run: |
          npm run build
          npm run smoke:pages
        env:
          GITHUB_PAGES: 'true'
      - name: Upload Pages artifact
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: needs.update.outputs.changed == 'true'
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
