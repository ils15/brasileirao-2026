# Gate de qualidade em todo push/PR; a publicação em si mora no workflow
# reutilizável `_pages-build-deploy.yml`, compartilhado com `update-data.yml`
# (push do bot com `GITHUB_TOKEN` não dispara este arquivo).
name: GitHub Pages

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  # Publica só em push para `main`; em PR o job fica skipped e o run continua
  # sendo o gate de testes.
  pages:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/_pages-build-deploy.yml
    with:
      sha: ${{ github.sha }}

  # Alarme de defasagem do bundle publicado: confere se o Pages já serve o
  # corte analítico deste commit. É alerta, não gate — `continue-on-error` no
  # job e no passo, e o script sempre sai com código 0. Roda depois da
  # publicação, então não atrasa nem condiciona o deploy.
  freshness:
    needs: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Compare published cutoff with the repository
        continue-on-error: true
        env:
          FRESHNESS_URL: https://ils15.github.io/brasileirao-2026/
        run: node scripts/check-deploy-freshness.mjs
